                - push
                - tag
                - pull_request
            branch_patterns:
                - pattern: develop # <<-- put the branch that the codemagic config file is
                  include: true
                  source: true
        scripts:
            - name: Install yarn dependencies
              script: |
                 yarn
            - name: Set Android SDK location
              script: |
                echo "sdk.dir=$HOME/programs/android-sdk-macosx" > "$FCI_BUILD_DIR/android/local.properties"
            - name: Set up keystore
              script: | 
                     echo "APP_VERSION_CODE=$APP_VERSION_CODE
                     APP_VERSION_NAME=$APP_VERSION_NAME" > .env
                     cat .env
                     echo $CM_KEYSTORE | base64 --decode > /android/app/tribl.keystore
                     cat >> "$FCI_BUILD_DIR/android/key.properties" <<EOF
                     storePassword=$CM_KEYSTORE_PASSWORD
                     keyPassword=$CM_KEY_ALIAS_PASSWORD
                     keyAlias=$CM_KEY_ALIAS_USERNAME
                     storeFile=/android/app/tribl.keystore
                     EOF
            - name: Build Android release
              script: |
                cd android 
                # ./gradlew assembleRelease
                ./gradlew bundleRelease 
        artifacts:
            - android/app/build/**/outputs/**/*.aab
        publishing:
            google_play:                        # For Android app
                 credentials: $GOOGLE_JSON # Put your encrypted JSON key file for Google Play service account
                 track: alpha 
            email:
                recipients:
                    - akinduko@thetriblnetwork.com # Put your email address for build notifications (optional)

    react-native-ios:
        name: React Native iOS
        max_build_duration: 120
        instance_type: mac_mini
        environment:
            vars:
                XCODE_WORKSPACE: "tribl.xcworkspace" # <-- Put the name of your Xcode workspace here
                XCODE_SCHEME: "tribl" # <-- Put the name of your Xcode scheme here
                # Automatic Code Signing 
                # https://docs.codemagic.io/yaml/distribution/
                # https://appstoreconnect.apple.com/access/api
                APP_STORE_CONNECT_ISSUER_ID: 69a6de90-b9ed-47e3-e053-5b8c7c11a4d1 # <-- Put your App Store Connect Issuer Id here
                APP_STORE_CONNECT_KEY_IDENTIFIER: GMJ454PN89 # <-- Put your App Store Connect Key Identifier here
                APP_STORE_CONNECT_PRIVATE_KEY: Encrypted() # <-- Put your App Store Connect Private Key here
                CERTIFICATE_PRIVATE_KEY: Encrypted()
            node: latest
            xcode: latest
            cocoapods: default
        triggering:
            events:
                - push
                - tag
                - pull_request
            branch_patterns:
                - pattern: develop # <<-- put the branch that the codemagic config file is
                  include: true
                  source: true
        scripts:
            - name: Install yarn dependencies
              script: |
                yarn
            - name: Install CocoaPods dependencies
              script: |
                cd ios && pod install
            - name: Set up keychain to be used for codesigning using Codemagic CLI 'keychain' command
              script: |
                keychain initialize
            - name: Fetch or create certificate
              script: |  
                echo $CERTIFICATE_PRIVATE_KEY | base64 --decode > /tmp/certificate.p12
                app-store-connect fetch-signing-files "com.thetriblnetwork.tribl" --type IOS_APP_ADHOC --create

            - name: Use system default keychain
              script: |
                keychain add-certificates 
            - name: Increment build number
              script: |
                #!/bin/sh
                set -e
                set -x
                cd $FCI_BUILD_DIR/ios
                agvtool new-version -all $(($BUILD_NUMBER + 1))
            - name: Set up code signing settings on Xcode project
              script: |
                cd ios && pod install
                xcode-project use-profiles
            - name: Build ipa for distribution
              script: |
                xcode-project build-ipa --workspace "$FCI_BUILD_DIR/ios/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
        artifacts:
            - build/ios/ipa/*.ipa
            - /tmp/xcodebuild_logs/*.log
            - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
            - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

        publishing:
          app_store_connect:                 
              apple_id: ikechi@thetriblnetwork.com  
              password: Encrypted(Z0FBQUFBQmY0aU9HMVNuSlVWMWp6TWZONWJURjl6c3piVnEyWXBfV3RKdURpUFJ3N2RJUXNHODNYQ1lNZzRWU0dHenZadjJHWm4tLUNqWUxhTUpSVFgtUzVBOWczMTFJSVE9PQ==) # <-- Put your App Specific Password. For more information visit: https://support.apple.com/en-us/HT204397
          email:
            recipients:
                - akinduko@thetriblnetwork.com
     
