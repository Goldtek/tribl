                CERTIFICATE_PRIVATE_KEY: Encrypted() # <-- Put your Certificate Private key here
            node: latest
            xcode: latest
            cocoapods: default
        triggering:
            events:
                - push
                - tag
                - pull_request
            branch_patterns:
                - pattern: develop # <<-- put the branch that the codemagic config file is
                  include: true
                  source: true
        scripts:
            - name: Install npm dependencies
              script: |
                yarn
            - name: Install CocoaPods dependencies
              script: |
                cd ios && pod install
            - name: Set up keychain to be used for codesigning using Codemagic CLI 'keychain' command
              script: |
                keychain initialize
            # - name: Set up Provisioning profiles from environment variables (Use with manual code signing)
              # script: |
                # PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
                # mkdir -p "$PROFILES_HOME"
                # PROFILE_PATH="$(mktemp "$PROFILES_HOME"/$(uuidgen).mobileprovision)"
                # echo ${CM_PROVISIONING_PROFILE} | base64 --decode > $PROFILE_PATH
                # echo "Saved provisioning profile $PROFILE_PATH"
            - name: 
              script: |  
                app-store-connect fetch-signing-files "com.thetriblnetwork.tribl" --type IOS_APP_ADHOC --create
            # - name: Set up signing certificate (Use with manual code signing)
            #   script: |
            #     echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
            #     keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD
            - name: Use system default keychain
              script: |
                keychain add-certificates
            - name: Increment build number
              script: |
                #!/bin/sh
                set -e
                set -x
                cd $FCI_BUILD_DIR/ios
                agvtool new-version -all $(($BUILD_NUMBER + 1))
            - name: Set up code signing settings on Xcode project
              script: |
                xcode-project use-profiles
            - name: Build ipa for distribution
              script: |
                xcode-project build-ipa --workspace "$FCI_BUILD_DIR/ios/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
        artifacts:
            - build/ios/ipa/*.ipa
            - /tmp/xcodebuild_logs/*.log
            - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
            - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

        publishing:
          # app_store_connect:                 
              # apple_id: yourAppleId@example.com  
            #   password: Encrypted(...) # <-- Put your App Specific Password. For more information visit: https://support.apple.com/en-us/HT204397
          email:
            recipients:
                - stephen.olabode@nautilus.tech
     
