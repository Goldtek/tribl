                    # keyAlias=$CM_KEY_ALIAS_USERNAME
                    # storeFile=/tmp/keystore.keystore
                    # EOF
            - name: Build Android release
              script: |
                # build Android
                cd android 
                ./gradlew 
        artifacts:
            - android/app/build/outputs/**/*.apk
        publishing:
            email:
